<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derpmanjons</title>
    <meta name="description" content="Derpmanjons' personal website">

    <meta property="og:title" content="Derpmanjons">
    <meta property="og:description" content="Derpmanjons' personal website">
    <meta property="og:image" content="https://derpmanjons.us/images/Background.webp">
    <meta property="og:url" content="https://derpmanjons.us/">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
   <div class="content-card">
    <header>Welcome to my website!</header>
   </div>
   <div class="content-card main-card">
    <main>
        <p>This will be what I add to ALL of my sosial media in order to brag about how cool I am!</p>
        <p>As I am learning, it may be a little bit before anything impressive is here...</p>
        <p>I love you!</p>
    </main>
   </div>
   <div class="card-row">
    <div class="content-card social-card">
      <section aria-labelledby="social-links-title">
        <h2 id="social-links-title">My links!</h2>
        <ul class="social-links">
          <li><a href="https://www.youtube.com/@Derpmanjons"><img class="social-icon" src="https://cdn.simpleicons.org/youtube/FF0000" alt="">YouTube</a></li>
          <li><a href="https://www.twitch.tv/derpmanjons"><img class="social-icon" src="https://cdn.simpleicons.org/twitch/9146FF" alt="">Twitch</a></li>
          <li><a href="https://www.threads.com/@derpmanjons"><img class="social-icon" src="https://cdn.simpleicons.org/threads/000000" alt="">Threads</a></li>
        </ul>
      </section>
    </div>
   </div>
    <footer></footer>
      <script>
        const cards = [...document.querySelectorAll(".content-card")];
        const textElements = [...document.querySelectorAll("header, main p, .social-card h2, .social-links a")];
        const letters = [];
        const segmenter = typeof Intl.Segmenter === "function"
          ? new Intl.Segmenter(undefined, { granularity: "grapheme" })
          : null;
        const cardGlowRange = 220;
        const letterGlowRange = 56;
        let pointerX = 0;
        let pointerY = 0;
        let frameRequested = false;

        for (const element of textElements) {
          const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);

          for (const textNode of textNodes) {
            const segments = segmenter
              ? [...segmenter.segment(textNode.textContent)].map(({ segment }) => segment)
              : Array.from(textNode.textContent);
            const textRun = document.createElement("span");

            for (const segment of segments) {
              if (/\s/u.test(segment)) {
                textRun.append(document.createTextNode(segment));
              } else {
                const letter = document.createElement("span");
                letter.className = "glow-letter";
                letter.textContent = segment;
                textRun.append(letter);
                letters.push(letter);
              }
            }

            textNode.replaceWith(textRun);
          }
        }

        function updateGlow() {
          frameRequested = false;

          for (const card of cards) {
            const rect = card.getBoundingClientRect();
            const localX = pointerX - rect.left;
            const localY = pointerY - rect.top;
            const clamp = (value, max) => Math.min(max, Math.max(0, value));
            const edgeCandidates = [
              { side: "top", x: clamp(localX, rect.width), y: 0 },
              { side: "right", x: rect.width, y: clamp(localY, rect.height) },
              { side: "bottom", x: clamp(localX, rect.width), y: rect.height },
              { side: "left", x: 0, y: clamp(localY, rect.height) }
            ].map((edge) => ({
              ...edge,
              distance: Math.hypot(localX - edge.x, localY - edge.y)
            }));
            const nearestEdge = edgeCandidates.reduce((nearest, edge) =>
              edge.distance < nearest.distance ? edge : nearest
            );
            const glow = Math.max(0, 1 - nearestEdge.distance / cardGlowRange);
            const sideFactor = nearestEdge.side === "left" || nearestEdge.side === "right" ? 0.8 : 1;

            card.style.setProperty("--edge-x", `${nearestEdge.x + 1}px`);
            card.style.setProperty("--edge-y", `${nearestEdge.y + 1}px`);
            for (const side of ["top", "right", "bottom", "left"]) {
              const sideGlow = side === nearestEdge.side ? glow * sideFactor : 0;
              card.style.setProperty(`--edge-${side}-alpha`, sideGlow.toFixed(3));
            }
            card.style.setProperty("--edge-glow-alpha", (glow * sideFactor * 0.75).toFixed(3));
          }

          for (const letter of letters) {
            const rect = letter.getBoundingClientRect();
            const dx = Math.max(rect.left - pointerX, 0, pointerX - rect.right);
            const dy = Math.max(rect.top - pointerY, 0, pointerY - rect.bottom);
            const proximity = Math.max(0, 1 - Math.hypot(dx, dy) / letterGlowRange);
            const glow = proximity * proximity;
            letter.style.setProperty("--letter-glow-blur", `${(glow * 9).toFixed(1)}px`);
            letter.style.setProperty("--letter-glow-alpha", (glow * 0.95).toFixed(3));
          }
        }

        window.addEventListener("pointermove", (event) => {
          if (event.pointerType === "touch") return;
          pointerX = event.clientX;
          pointerY = event.clientY;
          if (!frameRequested) {
            frameRequested = true;
            requestAnimationFrame(updateGlow);
          }
        });

        window.addEventListener("pointerleave", () => {
          for (const card of cards) {
            for (const side of ["top", "right", "bottom", "left"]) {
              card.style.setProperty(`--edge-${side}-alpha`, "0");
            }
            card.style.setProperty("--edge-glow-alpha", "0");
          }
          for (const letter of letters) {
            letter.style.setProperty("--letter-glow-blur", "0px");
            letter.style.setProperty("--letter-glow-alpha", "0");
          }
        });
      </script>
  </body>
</html>
